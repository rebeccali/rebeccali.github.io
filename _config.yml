---
# Build settings only. The site's content lives in _data/:
#
#   _data/profile.yml  name, tagline, meta description, portrait, links, CV
#   _data/home.yml     the home page
#   _data/cv.yml       the CV page
#   _data/orgs.yml     logo registry, shared by both pages
#
# Anything edited here needs a `jekyll serve` restart; _data files do not.

url: https://rebecca.li
baseurl: ''
timezone: UTC

author: Rebecca Li
author-img: 41944096_2104931262885349_7854223547646869504_o.jpg
about-author: Climate Helper 
tagline: Robotics · Controls · Fusion Diagnostics

email: make@rebecca.li
github: rebeccali
linkedin: rebecca-li-15285378
cv: /assets/cv-rebecca-li-2026-05.pdf

markdown: kramdown
encoding: utf-8

# The github-pages gem defaults to jekyll-theme-primer when no theme is set,
# which publishes an unused assets/css/style.css. This site brings its own CSS.
theme: null

plugins:
- jekyll-sitemap

exclude:
- _archive
- vendor
- .bundle
- Gemfile
- Gemfile.lock
- README.md
- LICENSE

# The photography galleries stay reachable at their old URLs but are
# deliberately not linked from the site — keep them out of the sitemap too.
defaults:
- scope:
    path: photography
  values:
    sitemap: false
