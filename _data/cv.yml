# Content of the CV page (cv.html). Sections render in the order listed here,
# and the anchor nav at the top of the page is generated from them.
#
# Each section has a `type` that decides how its contents are drawn:
#
#   entries       logo + title + role/meta + date + prose  (Experience, Education, Projects)
#   publications  numbered list; `authors` is a list of names, and any name
#                 matching profile.name is bolded automatically
#   skills        a definition list of term/detail pairs
#
# In an `entries` section every field except `title` is optional: leave out
# `org` and the entry renders without a logo, leave out `body` and it is just
# a heading line. Prose may contain inline HTML.

title: CV
description: Curriculum vitae of Rebecca Li — roboticist and controls engineer.

heading: Curriculum Vitae
breadcrumb: ← Rebecca Li
download: Download CV (PDF)

sections:
  - id: experience
    heading: Experience
    type: entries
    entries:
      - org: cfs
        title: Commonwealth Fusion Systems
        role: Senior Diagnostician · Diagnostician · Diagnostics Support Engineer
        meta: Devens & Somerville, MA
        when: 2022 – 2026
        body: >-
          Led the bolometry diagnostic for SPARC end to end: physics requirements, sensor and camera
          design, electrical and mechanical integration, testing, and project management. Bolometers
          measure the power radiated out of the plasma, which means putting delicate sensors close to a
          tokamak — rapidly changing magnetic fields, neutron flux, and temperatures that rule out most
          of the obvious engineering answers. I coordinated the design across tokamak systems, CAD,
          supply chain, and program management, and developed the tomographic reconstruction that
          inverts the measurements into a picture of where the plasma is radiating. First author on the
          diagnostic's <em>Review of Scientific Instruments</em> paper. I started in 2022 as a
          Diagnostics Support Engineer, designing active optics and mechatronic interfaces for SPARC
          diagnostics.

      - org: vicarious
        title: Vicarious Surgical
        role: Robotics Software Engineer
        meta: Waltham, MA
        when: 2021 – 2022
        body: >-
          Technical lead for a physics-based, photorealistic simulation of robotic surgery in ROS 2
          and Gazebo, used to generate synthetic training data for machine learning where real surgical
          data is scarce and expensive. Alongside the simulation work I set up the team's CI and coding
          practices and reviewed code for more junior engineers.

      - org: deepmind
        title: DeepMind
        role: Research Scientist Intern
        meta: London, UK (remote)
        when: 2021
        body: >-
          Research on deep reinforcement learning policies for real robots, aimed at the gap between
          what works in simulation and what a physical machine can survive: reducing actuator
          wear-and-tear and making interaction safer, on open-source GCP infrastructure.

      - org: grasp
        title: University of Pennsylvania, GRASP Lab
        role: Graduate Researcher
        meta: Philadelphia, PA
        when: 2018 – 2021
        body: >-
          Three strands of work with Vijay Kumar and Mark Yim. I designed and verified a
          robust, perception-based controller for a UAV — one with guarantees that hold when the state
          estimate is coming from onboard vision rather than motion capture (IROS 2020). I built a
          dynamics simulation with an aerodynamic model for a one-centimetre, single-actuator UAV, as a
          design tool for a vehicle too small to instrument conventionally. And I designed and
          implemented the machine learning pipeline applying graph neural networks to decentralized
          swarm control, where each robot must act on only what its neighbours can tell it (ICRA 2022).

      - org: kittyhawk
        title: Kitty Hawk
        role: Controls Engineer · Mechanical Engineering Intern
        meta: Palo Alto, CA
        when: 2016 – 2018
        body: >-
          Designed and flight-tested autonomous take-off, landing, and navigation for an electric VTOL
          aircraft — LQR control, Kalman filtering, and online optimization for allocating thrust across
          actuators — and built the infrastructure for Monte Carlo simulation and flight data analysis
          that the team used to decide whether a change was safe to fly. As an intern the summer before,
          I prototyped a ballistic recovery system from ultra-light parachutes and off-the-shelf rockets,
          now <a href="https://patents.google.com/patent/US10507929B2/en">US Patent 10,507,929</a>.

      - org: medialab
        title: MIT Media Lab, Tangible Media Group
        role: Undergraduate Researcher
        meta: Cambridge, MA
        when: 2014 – 2017
        body: >-
          Designed and fabricated the electromechanics for a 2D array of linear actuators used for
          tactile simulation in VR — a surface that can push back, at a density where the mechanical
          design problem is mostly about what you can fit in the pitch.

