    nav: Projects
    type: entries
    entries:
      - org: mardesigns
        title: MAR Designs
        role: Founder
        when: 2020
        body: >-
          A robotic orthotic for treating pediatric cerebral palsy, spun out of the GRASP Lab. Won the
          Wharton Startup Challenge Innovation Award and first place at the Rothberg Catalyzer medical
          device hackathon; went through Penn's NSF I-Corps program.

      - org: combatrobotics
        title: The Dentist — BattleBots
        role: Founder, MIT Combat Robotics · Team co-captain
        when: 2016
        body: >-
          Founded the MIT Combat Robotics Club and co-captained the team that built <em>The Dentist</em>,
          a 250 lb robot with a 200 kJ spinning weapon, for the television show. Mostly an
          education in schedule risk.

      - title: Student leadership
        when: 2016 – 2021
        body: >-
          President of the Mechanical Engineering Graduate Association (MEGA) at Penn, 2019–2020.
          President of the <a href="http://miters.mit.edu/">MIT Electronic Research Society</a>, the
          student-run makerspace, 2016. Seminar and knowledge lead for the nuclear energy group in
          <a href="https://workonclimate.org/">Work On Climate</a>, 2021.

      - title: Teaching & mentoring
        when: 2015 – 2021
        body: >-
          Teaching assistant for MEAM 620 Advanced Robotics (graduate, Penn), 2.678 Electronics for
          Mechanical Systems and 2.12 Introduction to Robotics (undergraduate, MIT). Mentored three
          undergraduate researchers at Penn, including
          <a href="https://www.yufangzhou.xyz/">Fangzhou Yu</a>, now at the
          <a href="https://rai-inst.com/">Robotics and AI Institute</a>. Also taught with Make Learning
          Labs, Polygence, and the MIT Educational Studies Program, and spoke on a panel at the Girls
          Advancing in STEM (GAINS) conference.

