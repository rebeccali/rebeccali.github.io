about:
  lede: >-
    I build technology tackling climate change. For the last four years that meant plasma cameras 
    (ask me about bolometry!)
    with the SPARC Diagnostics team at Commonwealth Fusion Systems. Before that,
    I worked on robots - surgical simulation, quadrotor swarms, and flight controls for electric aircraft.
  paragraphs:
    - >-
      I want a world resilient to climate change, where people flourish in work, in play,
      and in community. My piece of that is making cutting-edge tech into cheap-and-robust tech.
  # Optional key for job search.
  availability: >-
    <strong>I'm looking for my next role developing climate technology</strong> (ideally early-stage, ideally near Boston, MA).
    If you'd like to chat, <a href="#contact">drop me a line</a>.

