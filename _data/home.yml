about:
  lede: >-
    I'm a roboticist and controls engineer. I spent the last four years at
    Commonwealth Fusion Systems leading the bolometry diagnostic for SPARC — designing sensors
    and cameras that have to survive strong magnetic fields, neutron radiation, and heat, and
    writing the tomography that turns their signals back into a picture of the plasma.
  paragraphs:
    - >-
      Before fusion I worked on robot learning and control: a research internship at DeepMind
      on making reinforcement learning policies gentler on real hardware, a simulation lead role at
      <a href="https://www.vicarioussurgical.com/">Vicarious Surgical</a>, and a masters at Penn's
      <a href="https://www.grasp.upenn.edu/">GRASP Lab</a> with
      <a href="https://www.kumarrobotics.org/">Vijay Kumar</a> and
      <a href="http://www.modlabupenn.org/">Mark Yim</a> on perception-based quadrotor control and
      graph neural networks for swarms. Before that I did flight controls for an electric VTOL
      aircraft at Kitty Hawk. I studied mechanical engineering at MIT, where I ran the student
      makerspace and founded the combat robotics club.
    - >-
      The thread running through all of it is hardware that has to work in the physical world,
      and the software that makes it work. I care most about climate — which is how I ended up in
      fusion, and roughly where I'd like to stay.
  # Drop this key (or blank it) when the job search is over and the callout disappears.
  availability: >-
    <strong>I'm currently looking for my next role.</strong>
    If that overlaps with what you're working on, <a href="#contact">get in touch</a>.

